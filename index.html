<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Agenda de Contactos</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- LOGIN -->
    <form class="form" action="paginas/contactos.html">
        <div class="form-title">
            <span>Inicia sesión en</span>
        </div>

        <div class="title-2">
            <span>AGENDA</span>
        </div>

        <div class="input-container">
            <input id="email-input" class="input-mail" type="email" placeholder="Correo electrónico" required>
            <span></span>
        </div>

        <section class="bg-stars">
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
        </section>

        <div class="input-container">
            <input class="input-pwd" type="password" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="submit">
            <span class="sign-text">Iniciar sesión</span>
        </button>

        <p class="signup-link">
            ¿No tienes cuenta?
            <a href="#" class="up">Regístrate aquí</a>
        </p>
    </form>

    <script>
        document.querySelector('.form').addEventListener('submit', function(e) {
            const email = document.getElementById('email-input').value;
            
            let nombreUsuario = email.split('@')[0];
            
            nombreUsuario = nombreUsuario.charAt(0).toUpperCase() + nombreUsuario.slice(1);

            localStorage.setItem('usuarioLogueado', nombreUsuario);
            localStorage.setItem('emailLogueado', email);
            
        });
    </script>
</body>
</html>
