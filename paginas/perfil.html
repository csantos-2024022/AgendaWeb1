<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil | Agenda Pro</title>
    <link rel="stylesheet" href="../css/contactos.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="contactos.html" style="color: #888; text-decoration: none; margin-right: 15px;">← Volver</a>
            <h1>Mi<span>Perfil</span></h1>
        </div>
    </header>

        <main class="perfil-container">
            <div class="profile-card">
                <div class="profile-banner"></div>
                <div class="profile-main-info">
                    <div class="avatar-container">
                        <img src="../img/unnamed.jpg" alt="Foto de Perfil">
                    </div>
                    <h2 id="profile-name">Nombre de Usuario</h2>
                    <span class="user-role">Administrador de Cuenta</span>
                </div>

                <div class="profile-details">
                    <div class="info-group">
                        <label>Correo Electrónico</label>
                        <p id="profile-email">correo@ejemplo.com</p>
                    </div>
                    <div class="info-group">
                        <label>Estado de la cuenta</label>
                        <p>Activa (Sesión actual)</p>
                    </div>
                </div>

                <div class="profile-footer">
                    <a href="../index.html" class="btn-logout" onclick="localStorage.clear()">Cerrar Sesión</a>
                </div>
            </div>
        </main>

        <script>
            // Cargar datos del localStorage
            const user = localStorage.getItem('usuarioLogueado');
            const email = localStorage.getItem('emailLogueado');

            if (user && email) {
                document.getElementById('profile-name').textContent = user;
                document.getElementById('profile-email').textContent = email;
            }
        </script>
</body>
</html>
